name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Guard against stale deploys
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "::warning::Newer commit $LATEST is on main — skipping out-of-order deploy of $GITHUB_SHA"
            exit 1
          fi

      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '888e985dae423cb6bab33658a25951de' }}

  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against stale deploys
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "::warning::Newer commit $LATEST is on main — skipping out-of-order deploy of $GITHUB_SHA"
            exit 1
          fi

      - name: Build and deploy dashboard
        working-directory: apps/dashboard
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '888e985dae423cb6bab33658a25951de' }}
